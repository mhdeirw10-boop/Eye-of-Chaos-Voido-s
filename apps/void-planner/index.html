<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10111a"><title>Void Planner</title><style>*{box-sizing:border-box}body{margin:0;background:#10111a;color:#f4f4fa;font:14px system-ui,sans-serif}header{padding:19px 16px;background:linear-gradient(135deg,#183d3b,#151622)}h1{font-size:21px;margin:0 0 5px}p{color:#a4a8bb;font-size:12px;line-height:1.6;margin:0}.wrap{padding:14px;display:grid;gap:13px}.panel{padding:14px;background:#191b29;border:1px solid #ffffff18;border-radius:16px}.panel h2{font-size:14px;margin:0 0 11px}.form{display:grid;gap:8px}.form input,.form select{width:100%;min-width:0;padding:11px;background:#0c0d14;color:#fff;border:1px solid #ffffff1c;border-radius:10px;font:inherit}.form button,.btn{padding:10px 12px;border-radius:10px;border:1px solid #ffffff1c;background:#ffffff09;color:#fff;font:inherit}.form button{background:#246d62}.filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}.filters button{padding:7px 10px;border:1px solid #ffffff1c;background:#ffffff08;border-radius:9px;color:#dce1ee}.filters button.active{background:#246d62}.task{display:flex;align-items:flex-start;gap:10px;padding:11px 0;border-bottom:1px solid #ffffff12}.task:last-child{border:0}.task input{margin-top:4px;accent-color:#5eead4;width:17px;height:17px}.taskmain{flex:1;min-width:0}.taskmain b{display:block;overflow-wrap:anywhere}.taskmain small{display:block;color:#a4a8bb;font-size:10px;margin-top:5px}.task.done b{text-decoration:line-through;color:#8d93a8}.task-actions button{border:0;background:transparent;color:#ff9da9;padding:4px}.empty{text-align:center;padding:18px;color:#a4a8bb}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.stat{background:#ffffff08;border-radius:12px;padding:10px;text-align:center}.stat b{display:block;font-size:20px}.stat small{color:#a4a8bb;font-size:10px}.foot{font-size:10px;color:#8f95a8}</style></head><body><header><h1>✓ Void Planner</h1><p>مهامك وخططك اليومية، محفوظة محليًا على هذا الجهاز.</p></header><main class="wrap"><section class="panel"><h2>إضافة مهمة</h2><form id="form" class="form"><input id="title" maxlength="140" required placeholder="ما الذي تريد إنجازه؟"><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><input id="date" type="date" aria-label="موعد المهمة"><select id="priority" aria-label="الأولوية"><option value="normal">عادية</option><option value="high">مهمة</option><option value="urgent">عاجلة</option></select></div><input id="details" maxlength="500" placeholder="تفاصيل اختيارية"><button type="submit">＋ إضافة المهمة</button></form><div class="stats"><div class="stat"><b id="total">0</b><small>كل المهام</small></div><div class="stat"><b id="pending">0</b><small>المتبقية</small></div><div class="stat"><b id="done">0</b><small>المكتملة</small></div></div></section><section class="panel"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><h2 style="margin:0">قائمة المهام</h2><button class="btn" id="clearDone">حذف المكتمل</button></div><div class="filters" id="filters" style="margin-top:12px"><button class="active" data-filter="all">الكل</button><button data-filter="pending">المتبقية</button><button data-filter="done">المكتملة</button></div><div id="list"></div></section><p class="foot">لا توجد مزامنة بين الأجهزة أو تذكيرات تعمل في الخلفية؛ هذه قائمة مهام محلية داخل التطبيق.</p></main><script>
(()=>{'use strict';const KEY='voidos_planner_tasks_v1',$=id=>document.getElementById(id);let tasks=[],filter='all';try{const v=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(v))tasks=v.filter(t=>t&&typeof t.id==='string')}catch{}function persist(){try{localStorage.setItem(KEY,JSON.stringify(tasks));return true}catch{alert('تعذّر الحفظ المحلي. صدّر بياناتك أو أفرغ مساحة المتصفح.');return false}}function render(){const root=$('list');root.replaceChildren();const visible=tasks.filter(t=>filter==='all'||(filter==='done'?t.done:!t.done)).sort((a,b)=>Number(a.done)-Number(b.done)||(a.date||'9999').localeCompare(b.date||'9999')||b.created-a.created);if(!visible.length){const e=document.createElement('div');e.className='empty';e.textContent='لا توجد مهام في هذا القسم.';root.append(e)}for(const t of visible){const row=document.createElement('div');row.className='task'+(t.done?' done':'');const check=document.createElement('input');check.type='checkbox';check.checked=!!t.done;check.setAttribute('aria-label','إنجاز المهمة');check.onchange=()=>{t.done=check.checked;persist();render()};const main=document.createElement('div');main.className='taskmain';const title=document.createElement('b');title.textContent=t.title;const meta=document.createElement('small');const labels={normal:'عادية',high:'مهمة',urgent:'عاجلة'};meta.textContent=(t.date?'الموعد: '+t.date+' · ':'')+'الأولوية: '+(labels[t.priority]||'عادية')+(t.details?' · '+t.details:'');main.append(title,meta);const actions=document.createElement('div');actions.className='task-actions';const del=document.createElement('button');del.textContent='حذف';del.onclick=()=>{tasks=tasks.filter(x=>x.id!==t.id);persist();render()};actions.append(del);row.append(check,main,actions);root.append(row)}$('total').textContent=tasks.length;$('pending').textContent=tasks.filter(t=>!t.done).length;$('done').textContent=tasks.filter(t=>t.done).length;document.querySelectorAll('[data-filter]').forEach(b=>b.classList.toggle('active',b.dataset.filter===filter))}$('form').onsubmit=e=>{e.preventDefault();const title=$('title').value.trim();if(!title)return;tasks.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random(),title,date:$('date').value,priority:$('priority').value,details:$('details').value.trim(),done:false,created:Date.now()});if(persist()){e.target.reset();render()}};$('filters').onclick=e=>{const b=e.target.closest('[data-filter]');if(b){filter=b.dataset.filter;render()}};$('clearDone').onclick=()=>{const before=tasks.length;tasks=tasks.filter(t=>!t.done);if(tasks.length!==before){persist();render()}};render()})();
</script><script src="../../js/brain/security/policy.js"></script>
<script src="../../js/brain/security/input.js"></script>
<script src="../../js/brain/security/storage.js"></script>
<script src="../../js/brain/security/index.js"></script>
<script src="../../js/kernel/eventBus.js"></script><script src="../../js/kernel/resultBus.js"></script><script src="../../js/kernel/serviceRegistry.js"></script><script src="../../js/kernel/intentEngine.js"></script><script src="../../js/kernel/taskRouter.js"></script><script src="../../js/kernel/diagnostics.js"></script><script src="../../js/kernel/kernel.js"></script><script src="../../js/chaos-layer.js"></script>
</body></html>
