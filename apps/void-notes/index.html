<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10111a"><title>Void Notes</title><style>
:root{color-scheme:dark;--bg:#10111a;--panel:#191b29;--line:#ffffff18;--text:#f4f4fa;--muted:#a4a8bb;--accent:#a78bfa}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,sans-serif}header{padding:18px 16px 12px;background:linear-gradient(140deg,#31234d,#151622);position:sticky;top:0;z-index:2}h1{font-size:21px;margin:0 0 5px}p{margin:0;color:var(--muted);font-size:12px}.tools{display:flex;gap:8px;margin-top:14px}.tools input{flex:1;min-width:0}.field,input,textarea,select{font:inherit;color:var(--text);background:#0c0d14;border:1px solid var(--line);border-radius:11px;padding:10px;outline:none}.tools button,.btn{border:1px solid var(--line);background:#ffffff0b;color:var(--text);border-radius:10px;padding:9px 12px}.layout{padding:14px;display:grid;gap:12px}.editor,.note{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:13px}.editor input{width:100%;margin-bottom:8px}.editor textarea{width:100%;min-height:145px;resize:vertical;line-height:1.7}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}.primary{background:#6d4fc4;border-color:#8b70e5}.note h3{font-size:14px;margin:0 0 7px;overflow-wrap:anywhere}.note p{white-space:pre-wrap;line-height:1.6;color:#d7d9e4;overflow-wrap:anywhere}.meta{font-size:10px;color:var(--muted);margin-top:10px}.note-actions{display:flex;gap:6px;margin-top:10px}.note-actions button{flex:1}.empty{text-align:center;padding:30px;color:var(--muted)}.status{font-size:11px;color:#c4b5fd;margin-top:7px;min-height:16px}
</style></head><body><header><h1>▤ Void Notes</h1><p>ملاحظات محلية محفوظة على هذا المتصفح</p><div class="tools"><input id="search" placeholder="ابحث في ملاحظاتك…" aria-label="بحث"><button id="new">＋ جديدة</button></div></header><main class="layout"><section class="editor" id="editor"><input id="title" maxlength="120" placeholder="عنوان الملاحظة"><textarea id="body" maxlength="30000" placeholder="اكتب فكرتك أو خطتك أو ملاحظتك هنا…"></textarea><div class="row"><input id="tag" maxlength="30" placeholder="وسم اختياري" style="flex:1;min-width:100px"><button class="btn primary" id="save">حفظ الملاحظة</button><button class="btn" id="cancel">إلغاء</button></div><div class="status" id="status" role="status"></div></section><section id="list"></section><div class="row"><button class="btn" id="export">تصدير نسخة JSON</button><button class="btn" id="importBtn">استيراد نسخة</button><input id="importFile" type="file" accept="application/json,.json" hidden></div><p>تنبيه: التخزين محلي؛ مسح بيانات المتصفح قد يحذف ملاحظاتك. استخدم التصدير للاحتفاظ بنسخة احتياطية.</p></main><script>
(()=>{'use strict';const KEY='voidos_notes_v1';const $=id=>document.getElementById(id);let notes=[],editing=null;try{const v=JSON.parse(localStorage.getItem(KEY)||'[]');notes=Array.isArray(v)?v.filter(n=>n&&typeof n==='object'&&typeof n.id==='string'):[]}catch{}function persist(){try{localStorage.setItem(KEY,JSON.stringify(notes));$('status').textContent='تم الحفظ على هذا الجهاز.';return true}catch{$('status').textContent='تعذّر الحفظ؛ قد تكون مساحة التخزين ممتلئة.';return false}}function reset(){editing=null;$('title').value='';$('body').value='';$('tag').value='';$('save').textContent='حفظ الملاحظة'}function escape(s){return String(s??'')}function render(){const q=$('search').value.trim().toLowerCase(),root=$('list');root.replaceChildren();const filtered=notes.filter(n=>(n.title+' '+n.body+' '+n.tag).toLowerCase().includes(q)).sort((a,b)=>b.updated-a.updated);if(!filtered.length){const e=document.createElement('div');e.className='empty';e.textContent=q?'لا توجد نتائج مطابقة.':'لا توجد ملاحظات بعد. ابدأ بتسجيل فكرة.';root.append(e);return}for(const n of filtered){const card=document.createElement('article');card.className='note';const h=document.createElement('h3');h.textContent=n.title||'ملاحظة بلا عنوان';const p=document.createElement('p');p.textContent=n.body;const meta=document.createElement('div');meta.className='meta';meta.textContent=(n.tag?'#'+n.tag+' · ':'')+new Date(n.updated).toLocaleString('ar-IQ');const actions=document.createElement('div');actions.className='note-actions';const edit=document.createElement('button');edit.className='btn';edit.textContent='تعديل';edit.onclick=()=>{editing=n.id;$('title').value=n.title;$('body').value=n.body;$('tag').value=n.tag||'';$('save').textContent='حفظ التعديلات';$('title').focus()};const del=document.createElement('button');del.className='btn';del.textContent='حذف';del.onclick=()=>{if(confirm('حذف هذه الملاحظة؟')){notes=notes.filter(x=>x.id!==n.id);persist();render()}};actions.append(edit,del);card.append(h,p,meta,actions);root.append(card)}}$('save').onclick=()=>{const title=$('title').value.trim(),body=$('body').value.trim();if(!title&&!body){$('status').textContent='اكتب عنوانًا أو محتوى أولًا.';return}const now=Date.now();if(editing){const n=notes.find(n=>n.id===editing);if(n)Object.assign(n,{title,body,tag:$('tag').value.trim(),updated:now})}else notes.push({id:crypto.randomUUID?crypto.randomUUID():String(now)+Math.random(),title,body,tag:$('tag').value.trim(),created:now,updated:now});if(persist()){reset();render()}};$('new').onclick=()=>{reset();$('title').focus()};$('cancel').onclick=reset;$('search').oninput=render;$('export').onclick=()=>{const blob=new Blob([JSON.stringify({format:'void-notes-backup-v1',exportedAt:new Date().toISOString(),notes},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='void-notes-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const data=JSON.parse(await file.text()),incoming=Array.isArray(data)?data:data.notes;if(!Array.isArray(incoming))throw Error('صيغة النسخة غير صحيحة');let count=0;for(const n of incoming){if(n&&typeof n==='object'&&(typeof n.title==='string'||typeof n.body==='string')){notes.push({id:(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random()),title:String(n.title||'').slice(0,120),body:String(n.body||'').slice(0,30000),tag:String(n.tag||'').slice(0,30),created:Number(n.created)||Date.now(),updated:Number(n.updated)||Date.now()});count++}}if(!persist())return;$('status').textContent='تم استيراد '+count+' ملاحظة.';render()}catch(err){$('status').textContent='فشل الاستيراد: '+err.message}finally{e.target.value=''}};render()})();
</script><script src="../../js/brain/security/policy.js"></script>
<script src="../../js/brain/security/input.js"></script>
<script src="../../js/brain/security/storage.js"></script>
<script src="../../js/brain/security/index.js"></script>
<script src="../../js/kernel/eventBus.js"></script><script src="../../js/kernel/resultBus.js"></script><script src="../../js/kernel/serviceRegistry.js"></script><script src="../../js/kernel/intentEngine.js"></script><script src="../../js/kernel/taskRouter.js"></script><script src="../../js/kernel/diagnostics.js"></script><script src="../../js/kernel/kernel.js"></script><script src="../../js/chaos-layer.js"></script>
</body></html>
