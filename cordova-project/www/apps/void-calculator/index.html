<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10111a"><title>Void Calculator</title><style>*{box-sizing:border-box}body{margin:0;background:#10111a;color:#f4f4fa;font:15px system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:16px}.calc{width:100%;max-width:390px;background:#191b29;border:1px solid #ffffff18;border-radius:24px;padding:18px;box-shadow:0 18px 50px #0005}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.head h1{font-size:19px;margin:0}.head button,.keys button{border:1px solid #ffffff17;background:#ffffff08;color:inherit;border-radius:13px;padding:14px}.display{background:#0b0c13;border-radius:15px;padding:15px;margin-bottom:12px;min-height:100px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}.expression{color:#a9acc0;min-height:23px;overflow-wrap:anywhere}.result{font-size:30px;text-align:left;overflow-wrap:anywhere}.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.keys button{font-size:18px;min-height:55px}.keys .op{background:#49347a}.keys .danger{background:#572a38}.keys .equal{background:#7654d3}.history{margin-top:14px;border-top:1px solid #ffffff18;padding-top:10px}.history h2{font-size:12px;color:#a9acc0}.history-list{display:grid;gap:5px}.history-list button{text-align:right;border:0;border-radius:8px;padding:8px;background:#ffffff08;color:#d9dbea;font-size:12px}.hint{font-size:10px;color:#999fb2;line-height:1.6;margin-top:10px}</style></head><body><main class="calc"><div class="head"><h1>⌗ Void Calculator</h1><button id="clearHistory">مسح السجل</button></div><section class="display" aria-live="polite"><div class="expression" id="expression">جاهز للحساب</div><div class="result" id="result">0</div></section><div class="keys" id="keys"><button class="danger" data-act="clear">AC</button><button data-act="back">⌫</button><button class="op" data-val="%">%</button><button class="op" data-val="/">÷</button><button data-val="7">7</button><button data-val="8">8</button><button data-val="9">9</button><button class="op" data-val="*">×</button><button data-val="4">4</button><button data-val="5">5</button><button data-val="6">6</button><button class="op" data-val="-">−</button><button data-val="1">1</button><button data-val="2">2</button><button data-val="3">3</button><button class="op" data-val="+">+</button><button data-act="sign">±</button><button data-val="0">0</button><button data-val=".">.</button><button class="equal" data-act="equals">=</button><button data-val="(">(</button><button data-val=")">)</button><button data-act="sqrt">√</button><button data-act="square">x²</button></div><section class="history"><h2>آخر العمليات</h2><div class="history-list" id="history"></div></section><p class="hint">الحسابات تُنفذ محليًا. يدعم العمليات الأساسية والأقواس والنسبة المئوية والجذر والتربيع. لا تستخدمه كآلة حساب علمية متخصصة.</p></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id);let expr='',lastResult='0',history=[];function show(message=''){ $('expression').textContent=message||expr||'جاهز للحساب';$('result').textContent=lastResult}function safeEval(s){if(!s||s.length>120||!/^[0-9+\-*/%.()\s]+$/.test(s))throw Error('صيغة غير صالحة أو طويلة جدًا');const t=s.match(/\d+(?:\.\d+)?|[()+\-*/%]/g)||[];if(t.join('')!==s.replace(/\s+/g,''))throw Error('صيغة غير صالحة');let i=0;function expr(){let v=term();while(t[i]==='+'||t[i]==='-'){const o=t[i++],r=term();v=o==='+'?v+r:v-r}return v}function term(){let v=factor();while(['*','/','%'].includes(t[i])){const o=t[i++],r=factor();if((o==='/'||o==='%')&&r===0)throw Error('لا يمكن القسمة على صفر');v=o==='*'?v*r:o==='/'?v/r:v%r}return v}function factor(){const x=t[i++];if(x==='+')return factor();if(x==='-')return-factor();if(x==='('){const v=expr();if(t[i++]!==')')throw Error('قوس إغلاق مفقود');return v}if(x===undefined||!/^\d/.test(x))throw Error('صيغة غير صالحة');return Number(x)}const n=expr();if(i!==t.length||!Number.isFinite(n))throw Error('نتيجة غير صالحة');return Number(n.toPrecision(12))}function drawHistory(){const root=$('history');root.replaceChildren();if(!history.length){root.textContent='لا توجد عمليات محفوظة في هذه الجلسة.';return}history.slice(0,5).forEach(item=>{const b=document.createElement('button');b.textContent=item.expr+' = '+item.result;b.onclick=()=>{expr=item.result;lastResult=item.result;show()};root.append(b)})}function append(v){if(expr.length>80)return;if(v==='.'&&/\d+(?:\.\d*)?$/.test(expr.split(/[+*/()%\-]/).pop()||''))return;expr+=v;show()}$('keys').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const act=b.dataset.act,val=b.dataset.val;try{if(val!==undefined){append(val);return}if(act==='clear'){expr='';lastResult='0';show();return}if(act==='back'){expr=expr.slice(0,-1);show();return}if(act==='equals'){const answer=safeEval(expr.replace(/%/g,'/100'));history.unshift({expr,result:String(answer)});history=history.slice(0,20);lastResult=String(answer);$('expression').textContent=expr+' =';expr=String(answer);drawHistory();$('result').textContent=lastResult;return}if(act==='sign'){if(expr)expr=expr.startsWith('-')?expr.slice(1):'-('+expr+')';else expr='-';show();return}if(act==='sqrt'||act==='square'){const n=safeEval(expr||lastResult);const answer=act==='sqrt'?Math.sqrt(n):n*n;if(!Number.isFinite(answer))throw Error('لا يمكن حساب هذه القيمة');history.unshift({expr:(act==='sqrt'?'√':'')+n+(act==='square'?'²':''),result:String(Number(answer.toPrecision(12)))});history=history.slice(0,20);expr=String(Number(answer.toPrecision(12)));lastResult=expr;show();drawHistory()}}catch(err){$('expression').textContent=err.message;$('result').textContent='—'}});$('clearHistory').onclick=()=>{history=[];drawHistory()};document.addEventListener('keydown',e=>{if(/^[0-9()+\-*/%.]$/.test(e.key)){append(e.key)}else if(e.key==='Enter'){e.preventDefault();document.querySelector('[data-act="equals"]').click()}else if(e.key==='Backspace'){expr=expr.slice(0,-1);show()}else if(e.key==='Escape'){expr='';lastResult='0';show()}});drawHistory();show();try{const pending=JSON.parse(localStorage.getItem('voidos_pending_calculation_v1')||'null');if(pending&&pending.expression&&Date.now()-pending.created<120000){localStorage.removeItem('voidos_pending_calculation_v1');expr=String(pending.expression);const answer=safeEval(expr.replace(/%/g,'/100'));lastResult=String(answer);history.unshift({expr,result:lastResult});history=history.slice(0,20);$('expression').textContent=expr+' =';$('result').textContent=lastResult;drawHistory()}}catch(e){$('expression').textContent='طلب CHAOS غير صالح: '+e.message}})();
</script><script src="../../js/brain/security/policy.js"></script><script src="../../js/brain/security/input.js"></script><script src="../../js/brain/security/storage.js"></script><script src="../../js/brain/security/index.js"></script><script src="../../js/kernel/eventBus.js"></script><script src="../../js/kernel/resultBus.js"></script><script src="../../js/kernel/serviceRegistry.js"></script><script src="../../js/kernel/intentEngine.js"></script><script src="../../js/kernel/taskRouter.js"></script><script src="../../js/kernel/diagnostics.js"></script><script src="../../js/kernel/kernel.js"></script><script src="../../js/chaos-layer.js"></script>
</body></html>
