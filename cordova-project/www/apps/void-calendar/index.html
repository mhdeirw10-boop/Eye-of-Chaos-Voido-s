<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10111a"><title>Void Calendar</title><style>*{box-sizing:border-box}body{margin:0;background:#10111a;color:#f4f4fa;font:14px system-ui,sans-serif}header{padding:18px 16px;background:linear-gradient(135deg,#49326b,#151622)}h1{font-size:21px;margin:0 0 5px}p{font-size:12px;line-height:1.6;color:#a4a8bb;margin:0}.wrap{padding:14px;display:grid;gap:12px}.panel{background:#191b29;border:1px solid #ffffff18;border-radius:16px;padding:13px}.monthbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:13px}.monthbar h2{font-size:15px;margin:0}.btn{padding:8px 11px;border:1px solid #ffffff1c;border-radius:10px;background:#ffffff08;color:#fff;font:inherit}.primary{background:#6d4fc4}.week,.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.week div{text-align:center;color:#a4a8bb;font-size:10px;padding:6px 0}.day{min-height:42px;border:1px solid transparent;border-radius:10px;background:#ffffff06;color:#f4f4fa;position:relative;font:inherit;font-size:12px}.day.other{opacity:.32}.day.today{border-color:#a78bfa}.day.selected{background:#6d4fc4;border-color:#c4b5fd}.day.has-event:after{content:'';position:absolute;width:4px;height:4px;border-radius:50%;background:#5eead4;bottom:4px;left:calc(50% - 2px)}.selected-title{font-size:13px;margin-bottom:9px}.form{display:grid;gap:8px}.form input,.form textarea{width:100%;padding:10px;border:1px solid #ffffff18;border-radius:10px;background:#0c0d14;color:#fff;font:inherit}.form textarea{resize:vertical;min-height:68px}.events{display:grid;gap:8px}.event{padding:10px;border:1px solid #ffffff16;border-radius:11px;background:#0e1019}.event b{display:block;overflow-wrap:anywhere}.event p{margin-top:5px;white-space:pre-wrap;overflow-wrap:anywhere}.event-actions{display:flex;gap:7px;margin-top:8px}.event-actions button{font-size:11px}.empty{text-align:center;padding:16px;color:#a4a8bb}.status{font-size:11px;color:#c4b5fd;min-height:16px;margin-top:7px}.upcoming{display:grid;gap:7px}.upcoming button{text-align:right;padding:10px;background:#ffffff07;border:1px solid #ffffff12;border-radius:10px;color:#fff}.upcoming small{display:block;color:#a4a8bb;margin-top:4px}</style></head><body><header><h1>▦ Void Calendar</h1><p>تقويم شهري وأحداث محلية، دون حساب سحابي.</p></header><main class="wrap"><section class="panel"><div class="monthbar"><button class="btn" id="prev" aria-label="الشهر السابق">‹ السابق</button><h2 id="month"></h2><button class="btn" id="next" aria-label="الشهر التالي">التالي ›</button></div><div class="week"><div>أحد</div><div>اثنين</div><div>ثلاثاء</div><div>أربعاء</div><div>خميس</div><div>جمعة</div><div>سبت</div></div><div class="days" id="days"></div><div class="status" id="status" role="status"></div></section><section class="panel"><h2 class="selected-title" id="selectedTitle"></h2><form class="form" id="form"><input id="eventTitle" maxlength="120" required placeholder="عنوان الحدث"><textarea id="eventDetails" maxlength="1000" placeholder="تفاصيل اختيارية"></textarea><button class="btn primary" type="submit">＋ إضافة حدث لهذا اليوم</button></form><div class="events" id="events" style="margin-top:10px"></div></section><section class="panel"><h2 style="font-size:14px;margin:0 0 10px">الأحداث القادمة</h2><div class="upcoming" id="upcoming"></div></section><p>تُحفظ الأحداث على هذا المتصفح فقط. لا توجد تنبيهات خلفية أو مزامنة بين الأجهزة.</p></main><script>
(()=>{'use strict';const KEY='voidos_calendar_events_v1',$=id=>document.getElementById(id);const pad=n=>String(n).padStart(2,'0'),keyOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());const today=new Date();let shown=new Date(today.getFullYear(),today.getMonth(),1),selected=keyOf(today),events=[];try{const v=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(v))events=v.filter(e=>e&&typeof e.id==='string'&&typeof e.date==='string')}catch{}function save(){try{localStorage.setItem(KEY,JSON.stringify(events));$('status').textContent='تم حفظ الأحداث محليًا.';return true}catch{$('status').textContent='تعذّر الحفظ؛ مساحة المتصفح قد تكون ممتلئة.';return false}}function render(){ $('month').textContent=shown.toLocaleDateString('ar-IQ',{month:'long',year:'numeric'});const root=$('days');root.replaceChildren();const first=new Date(shown.getFullYear(),shown.getMonth(),1);const offset=first.getDay();const start=new Date(first);start.setDate(1-offset);for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const k=keyOf(d),b=document.createElement('button');b.className='day'+(d.getMonth()!==shown.getMonth()?' other':'')+(k===keyOf(today)?' today':'')+(k===selected?' selected':'')+(events.some(e=>e.date===k)?' has-event':'');b.textContent=d.getDate();b.setAttribute('aria-label',k);b.onclick=()=>{selected=k;render()};root.append(b)}$('selectedTitle').textContent='أحداث يوم '+new Date(selected+'T12:00:00').toLocaleDateString('ar-IQ',{weekday:'long',day:'numeric',month:'long',year:'numeric'});const list=$('events');list.replaceChildren();const dayEvents=events.filter(e=>e.date===selected).sort((a,b)=>a.created-b.created);if(!dayEvents.length){const e=document.createElement('div');e.className='empty';e.textContent='لا توجد أحداث لهذا اليوم.';list.append(e)}for(const ev of dayEvents){const card=document.createElement('article');card.className='event';const b=document.createElement('b');b.textContent=ev.title;const p=document.createElement('p');p.textContent=ev.details||'دون تفاصيل إضافية';const actions=document.createElement('div');actions.className='event-actions';const del=document.createElement('button');del.className='btn';del.textContent='حذف';del.onclick=()=>{events=events.filter(x=>x.id!==ev.id);if(save())render()};actions.append(del);card.append(b,p,actions);list.append(card)}const up=$('upcoming');up.replaceChildren();const upcoming=events.filter(e=>e.date>=keyOf(today)).sort((a,b)=>a.date.localeCompare(b.date)||a.created-b.created).slice(0,6);if(!upcoming.length){const e=document.createElement('div');e.className='empty';e.textContent='لا توجد أحداث قادمة.';up.append(e)}for(const ev of upcoming){const b=document.createElement('button');b.textContent=ev.title;const small=document.createElement('small');small.textContent=ev.date;b.append(small);b.onclick=()=>{selected=ev.date;const d=new Date(ev.date+'T12:00:00');shown=new Date(d.getFullYear(),d.getMonth(),1);render()};up.append(b)}}$('prev').onclick=()=>{shown=new Date(shown.getFullYear(),shown.getMonth()-1,1);render()};$('next').onclick=()=>{shown=new Date(shown.getFullYear(),shown.getMonth()+1,1);render()};$('form').onsubmit=e=>{e.preventDefault();const title=$('eventTitle').value.trim();if(!title)return;events.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random(),date:selected,title,details:$('eventDetails').value.trim(),created:Date.now()});if(save()){e.target.reset();render()}};render()})();
</script><script src="../../js/brain/security/policy.js"></script>

</body></html>
